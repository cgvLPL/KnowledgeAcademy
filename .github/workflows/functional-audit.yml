name: Functional audit

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-functional-audit-fixes.py
      - app/admin-functionality-enhancer.tsx
      - app/admin-functionality-enhancer.css
      - app/layout.tsx
      - tests/function-contract.test.mjs
      - .github/workflows/functional-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cgv-functional-audit
  cancel-in-progress: true

jobs:
  audit-and-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply audited source fixes
        run: python3 scripts/apply-functional-audit-fixes.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Apps Script syntax
        run: |
          cp google-apps-script/Code.gs /tmp/cgv-code.js
          node --check /tmp/cgv-code.js

      - name: Run function contract tests
        run: node --test tests/function-contract.test.mjs

      - name: Run lint
        run: npm run lint

      - name: Build GitHub Pages artifact
        run: npm run build:github-pages
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbz0_-mm0ya8mmBf-mCmFGQhRbR4h2GCVJjwtq3iGUTKZUDP8l5p89ahnSyP41rppA78lQ/exec

      - name: Check live backend health
        id: health
        shell: bash
        run: |
          set -o pipefail
          response="$(curl --retry 3 --retry-delay 2 --fail --silent --show-error --location 'https://script.google.com/macros/s/AKfycbz0_-mm0ya8mmBf-mCmFGQhRbR4h2GCVJjwtq3iGUTKZUDP8l5p89ahnSyP41rppA78lQ/exec')"
          printf '%s' "$response" > /tmp/backend-health.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/backend-health.json","utf8")); if(!x.ok) process.exit(1); console.log(x);'

      - name: Record verified audit result
        run: |
          mkdir -p audit
          health="$(cat /tmp/backend-health.json | tr -d '\n')"
          cat > audit/latest.md <<EOF
          # CGV Exams functional audit

          Verified on: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          - Apps Script syntax: PASS
          - Frontend/API contract tests: PASS
          - ESLint: PASS
          - GitHub Pages static build: PASS
          - Live Apps Script health: PASS

          Live health response:

          \`\`\`json
          ${health}
          \`\`\`
          EOF

          if git diff --quiet; then
            echo "No source changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/exam-client.tsx google-apps-script/Code.gs audit/latest.md
          git commit -m "Apply verified functional audit fixes [skip ci]"
          git push origin HEAD:main
