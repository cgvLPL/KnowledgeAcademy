name: Verify application

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate package metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const lockRootVersion = lock.packages?.['']?.version;
          if (lock.version !== pkg.version || lockRootVersion !== pkg.version) {
            console.error(`Version mismatch: package.json=${pkg.version}, package-lock.json=${lock.version}, lock root=${lockRootVersion}`);
            process.exit(1);
          }
          console.log(`Package metadata aligned at ${pkg.version}`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate Apps Script syntax
        run: |
          cp google-apps-script/Code.gs /tmp/cgv-code.js
          cp google-apps-script/ZZLiveQuiz.gs /tmp/cgv-live-quiz.js
          cat google-apps-script/Code.gs google-apps-script/ZZLiveQuiz.gs > /tmp/cgv-apps-script.js
          node --check /tmp/cgv-code.js
          node --check /tmp/cgv-live-quiz.js
          node --check /tmp/cgv-apps-script.js

      - name: Validate TypeScript and lint rules
        run: |
          npm run typecheck
          npm run lint

      - name: Build static application
        run: npm run build:github-pages
        env:
          NEXT_PUBLIC_BASE_PATH: /KnowledgeAcademy
          NEXT_PUBLIC_SITE_URL: https://cgvlpl.github.io/KnowledgeAcademy/
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbz0_-mm0ya8mmBf-mCmFGQhRbR4h2GCVJjwtq3iGUTKZUDP8l5p89ahnSyP41rppA78lQ/exec
          NEXT_PUBLIC_CAPACITY_SPREAD_MS: "0"

      - name: Run complete regression suite
        run: node --test tests/*.test.mjs

      - name: Install visual regression browser
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install chromium

      - name: Run responsive visual regression suite
        run: npx playwright test --config tests/visual/playwright.config.mjs

      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.event.pull_request.number || github.run_id }}
          path: test-results/visual-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Validate Pages artifact
        run: |
          test -f dist/client/index.html
          test -f dist/client/.nojekyll
          grep -q "/KnowledgeAcademy/" dist/client/index.html
          if grep -R -q "/CGV.Exams/" dist/client; then
            echo "Generated Pages artifact still references the upstream repository path." >&2
            exit 1
          fi
