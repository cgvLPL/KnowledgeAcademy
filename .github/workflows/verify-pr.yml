name: Verify application

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-reporting-exclusion:
    if: github.head_ref == 'agent/exclude-participants-reporting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reporting exclusion branch
        uses: actions/checkout@v6
        with:
          ref: agent/exclude-participants-reporting
          fetch-depth: 0

      - name: Run staged reporting exclusion patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-reporting-exclusion.yml').read_text()
          marker = "          python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('staged patch script not found')
          script = workflow.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(script), 'apply-reporting-exclusion.py', 'exec'))
          PY

      - name: Commit and push feature patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: exclude participants from reporting"
          git push origin HEAD:agent/exclude-participants-reporting

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Apps Script syntax
        run: |
          cp google-apps-script/Code.gs /tmp/cgv-code.js
          node --check /tmp/cgv-code.js

      - name: Validate TypeScript and lint rules
        run: |
          npm run typecheck
          npm run lint

      - name: Build static application
        run: npm run build:github-pages
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbz0_-mm0ya8mmBf-mCmFGQhRbR4h2GCVJjwtq3iGUTKZUDP8l5p89ahnSyP41rppA78lQ/exec
          NEXT_PUBLIC_CAPACITY_SPREAD_MS: "0"

      - name: Run complete regression suite
        run: node --test tests/*.test.mjs

      - name: Install visual regression browser
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install chromium

      - name: Run responsive visual regression suite
        run: npx playwright test --config tests/visual/playwright.config.mjs

      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.event.pull_request.number }}
          path: test-results/visual-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Validate Pages artifact
        run: |
          test -f dist/client/index.html
          test -f dist/client/.nojekyll
