name: Verify application

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Apps Script syntax
        run: |
          cp google-apps-script/Code.gs /tmp/cgv-code.js
          node --check /tmp/cgv-code.js

      - name: Build static application
        run: npm run build:github-pages
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbz0_-mm0ya8mmBf-mCmFGQhRbR4h2GCVJjwtq3iGUTKZUDP8l5p89ahnSyP41rppA78lQ/exec

      - name: Run complete regression suite
        run: node --test tests/*.test.mjs

      - name: Validate Pages artifact
        run: |
          test -f dist/client/index.html
          test -f dist/client/.nojekyll
