name: Refresh migration lockfile
on:
  workflow_dispatch:
  push:
    branches:
      - neon-backend-migration
    paths:
      - package.json
permissions:
  contents: write
jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message || '', '[lockfile-refresh]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neon-backend-migration
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "[lockfile-refresh] Update migration dependencies"
          git push
