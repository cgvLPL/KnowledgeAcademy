name: Apply visual polish repair

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-visual-polish.mjs
      - .github/workflows/apply-visual-polish.yml
      - app/visual-polish.css
      - app/layout.tsx

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply visual markup repair
        run: node scripts/apply-visual-polish.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate Apps Script syntax
        run: |
          cp google-apps-script/Code.gs /tmp/cgv-code.js
          node --check /tmp/cgv-code.js

      - name: Build static application
        run: npm run build:github-pages
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbz0_-mm0ya8mmBf-mCmFGQhRbR4h2GCVJjwtq3iGUTKZUDP8l5p89ahnSyP41rppA78lQ/exec

      - name: Run all regression tests
        run: node --test tests/*.test.mjs

      - name: Commit verified markup repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/exam-client.tsx tests/visual-polish.test.mjs
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
            exit 0
          fi
          git commit -m "Polish course and schedule visuals"
          git push origin HEAD:${{ github.head_ref }}
