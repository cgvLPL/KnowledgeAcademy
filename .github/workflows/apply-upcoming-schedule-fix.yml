name: Apply upcoming schedule repair

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-upcoming-schedule-fix.mjs
      - scripts/finalize-upcoming-schedule-fix.mjs
      - .github/workflows/apply-upcoming-schedule-fix.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply source repair
        run: |
          node scripts/apply-upcoming-schedule-fix.mjs
          node scripts/finalize-upcoming-schedule-fix.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate Apps Script syntax
        run: |
          cp google-apps-script/Code.gs /tmp/cgv-code.js
          node --check /tmp/cgv-code.js

      - name: Build static application
        run: npm run build:github-pages
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbz0_-mm0ya8mmBf-mCmFGQhRbR4h2GCVJjwtq3iGUTKZUDP8l5p89ahnSyP41rppA78lQ/exec

      - name: Run finalized regression tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p audit
          set +e
          node --test tests/*.test.mjs 2>&1 | tee audit/finalized-test-output.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload finalized test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalized-upcoming-test-output
          path: audit/finalized-test-output.log
          if-no-files-found: error

      - name: Enforce regression result
        if: always()
        run: test "${{ steps.tests.outputs.exit_code }}" = "0"
