name: Apply upcoming schedule repair

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-upcoming-schedule-fix.mjs
      - .github/workflows/apply-upcoming-schedule-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply source repair
        run: node scripts/apply-upcoming-schedule-fix.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate Apps Script syntax
        run: |
          cp google-apps-script/Code.gs /tmp/cgv-code.js
          node --check /tmp/cgv-code.js

      - name: Run all regression tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p audit
          set +e
          node --test tests/*.test.mjs 2>&1 | tee audit/upcoming-test-output.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build static application
        id: build
        continue-on-error: true
        run: |
          mkdir -p audit
          set +e
          npm run build:github-pages 2>&1 | tee audit/upcoming-build-output.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbz0_-mm0ya8mmBf-mCmFGQhRbR4h2GCVJjwtq3iGUTKZUDP8l5p89ahnSyP41rppA78lQ/exec

      - name: Commit repaired source and diagnostics to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Apply upcoming evaluation repair"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Enforce verification result
        run: |
          test "${{ steps.tests.outputs.exit_code }}" = "0"
          test "${{ steps.build.outputs.exit_code }}" = "0"
