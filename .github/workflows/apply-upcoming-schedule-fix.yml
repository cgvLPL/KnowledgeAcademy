name: Apply upcoming schedule repair

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-upcoming-schedule-fix.mjs
      - .github/workflows/apply-upcoming-schedule-fix.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply source repair
        run: node scripts/apply-upcoming-schedule-fix.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate Apps Script syntax
        run: |
          cp google-apps-script/Code.gs /tmp/cgv-code.js
          node --check /tmp/cgv-code.js

      - name: Run all regression tests
        run: node --test tests/*.test.mjs

      - name: Build static application
        run: npm run build:github-pages
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbz0_-mm0ya8mmBf-mCmFGQhRbR4h2GCVJjwtq3iGUTKZUDP8l5p89ahnSyP41rppA78lQ/exec

      - name: Stage verified files
        run: |
          mkdir -p verified/app verified/google-apps-script verified/tests verified/.github/workflows
          cp app/runtime-functionality-enhancer.tsx verified/app/
          cp app/exam-client.tsx verified/app/
          cp app/layout.tsx verified/app/
          cp app/upcoming-evaluations.css verified/app/
          cp google-apps-script/Code.gs verified/google-apps-script/
          cp tests/function-contract.test.mjs verified/tests/
          cp tests/upcoming-evaluations.test.mjs verified/tests/
          cp .github/workflows/deploy-pages.yml verified/.github/workflows/
          if [ -f .github/workflows/verify-application.yml ]; then cp .github/workflows/verify-application.yml verified/.github/workflows/; fi

      - name: Upload verified repair
        uses: actions/upload-artifact@v4
        with:
          name: upcoming-schedule-verified-files
          path: verified
          if-no-files-found: error
