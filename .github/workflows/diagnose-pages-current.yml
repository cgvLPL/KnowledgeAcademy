name: Diagnose current Pages pipeline

on:
  push:
    branches:
      - fix/pages-stale-release-test

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Run complete diagnostic
        id: diagnostic
        env:
          NEXT_PUBLIC_BASE_PATH: /CGV.Exams
        run: |
          set +e
          {
            echo '# Pages repair diagnostic'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '## Workflow files'
            echo '```text'
            find .github/workflows -maxdepth 1 -type f -print | sort
            echo '```'
            echo
            echo '## Workflow names'
            echo '```text'
            for file in .github/workflows/*; do
              printf '%s: ' "$file"
              sed -n 's/^name:[[:space:]]*//p' "$file" | head -n 1
            done
            echo '```'
            echo
            echo '## Apps Script syntax'
          } > report.md

          cp google-apps-script/Code.gs /tmp/cgv-code.js
          node --check /tmp/cgv-code.js >> report.md 2>&1
          apps_status=$?

          echo >> report.md
          echo '## Install dependencies' >> report.md
          npm ci >> report.md 2>&1
          install_status=$?

          build_status=99
          test_status=99
          artifact_status=99
          if [ "$install_status" -eq 0 ]; then
            echo >> report.md
            echo '## Static build' >> report.md
            npm run build:github-pages >> report.md 2>&1
            build_status=$?

            echo >> report.md
            echo '## Complete regression suite' >> report.md
            node --test tests/*.test.mjs >> report.md 2>&1
            test_status=$?

            if [ -f dist/client/index.html ] && [ -f dist/client/.nojekyll ]; then
              artifact_status=0
            else
              artifact_status=1
            fi
          fi

          {
            echo
            echo '## Result'
            echo "- Apps Script: ${apps_status}"
            echo "- Install: ${install_status}"
            echo "- Build: ${build_status}"
            echo "- Tests: ${test_status}"
            echo "- Artifact: ${artifact_status}"
          } >> report.md

          echo "apps_status=${apps_status}" >> "$GITHUB_OUTPUT"
          echo "install_status=${install_status}" >> "$GITHUB_OUTPUT"
          echo "build_status=${build_status}" >> "$GITHUB_OUTPUT"
          echo "test_status=${test_status}" >> "$GITHUB_OUTPUT"
          echo "artifact_status=${artifact_status}" >> "$GITHUB_OUTPUT"

      - name: Publish diagnostic issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 report.md > issue-body.md
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'Pages repair diagnostic in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'Pages repair diagnostic' --body-file issue-body.md
          fi

      - name: Enforce diagnostic result
        if: always()
        run: |
          test "${{ steps.diagnostic.outputs.apps_status }}" = "0"
          test "${{ steps.diagnostic.outputs.install_status }}" = "0"
          test "${{ steps.diagnostic.outputs.build_status }}" = "0"
          test "${{ steps.diagnostic.outputs.test_status }}" = "0"
          test "${{ steps.diagnostic.outputs.artifact_status }}" = "0"
