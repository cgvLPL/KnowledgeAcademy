name: Diagnose regression failure

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tests and capture output
        id: tests
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > test-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment diagnostic output
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Regression diagnostic"
            echo
            echo "Test exit status: ${{ steps.tests.outputs.status }}"
            echo
            echo '```text'
            tail -n 240 test-output.txt
            echo '```'
            echo
            echo "### Hard-coded release markers"
            echo '```text'
            grep -RInE '2026\\.07\\.(25|26)|cgv-ui-release' tests || true
            echo '```'
          } > diagnostic.md
          gh pr comment "$PR_NUMBER" --body-file diagnostic.md
