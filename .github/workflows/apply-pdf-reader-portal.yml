name: Apply PDF reader portal fix

on:
  push:
    branches:
      - agent/sync-knowledge-centre-gas

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[pdf-reader-portal-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/sync-knowledge-centre-gas
          fetch-depth: 0

      - name: Apply PDF reader portal patch
        run: node scripts/apply-pdf-reader-portal.mjs

      - name: Remove one-time patch machinery
        run: |
          rm scripts/apply-pdf-reader-portal.mjs
          rm .github/workflows/apply-pdf-reader-portal.yml

      - name: Commit portal fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/knowledge-centre.tsx app/knowledge-pdf-reader.css tests/knowledge-centre.test.mjs updates/2026-08-17-knowledge-centre-gas-sync.md scripts/apply-pdf-reader-portal.mjs .github/workflows/apply-pdf-reader-portal.yml
          git commit -m "Portal PDF reader above app chrome [pdf-reader-portal-applied]"
          git push origin HEAD:agent/sync-knowledge-centre-gas
