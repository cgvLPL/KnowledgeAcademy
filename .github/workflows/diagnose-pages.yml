name: Diagnose CGV Exams Pages deployment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Apps Script syntax
        run: |
          cp google-apps-script/Code.gs /tmp/cgv-code.js
          node --check /tmp/cgv-code.js

      - name: Build static site
        run: npm run build:github-pages
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbz0_-mm0ya8mmBf-mCmFGQhRbR4h2GCVJjwtq3iGUTKZUDP8l5p89ahnSyP41rppA78lQ/exec

      - name: Run complete regression suite
        id: tests
        continue-on-error: true
        run: |
          mkdir -p audit
          set +e
          node --test tests/*.test.mjs 2>&1 | tee audit/pages-regression.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify Pages artifact
        run: |
          test -d dist/client
          test -f dist/client/index.html
          find dist/client -maxdepth 2 -type f | sort | head -100

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-regression-diagnostics
          path: audit/pages-regression.log
          if-no-files-found: error

      - name: Enforce regression result
        if: always()
        run: test "${{ steps.tests.outputs.exit_code }}" = "0"
