name: Publish CGV Knowledge Academy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: knowledge-academy-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Apps Script syntax
        run: |
          cp google-apps-script/Code.gs /tmp/cgv-code.js
          node --check /tmp/cgv-code.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build:github-pages
        env:
          NEXT_PUBLIC_BASE_PATH: /KnowledgeAcademy
          NEXT_PUBLIC_SITE_URL: https://cgvlpl.github.io/KnowledgeAcademy/
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbz0_-mm0ya8mmBf-mCmFGQhRbR4h2GCVJjwtq3iGUTKZUDP8l5p89ahnSyP41rppA78lQ/exec

      - name: Validate generated site
        run: |
          test -f dist/client/index.html
          test -d dist/client/assets
          test -f dist/client/brand/cgv-knowledge-academy.svg
          grep -q "CGV Knowledge Academy" dist/client/index.html
          grep -q "/KnowledgeAcademy/" dist/client/index.html
          if grep -R -q "/CGV.Exams/" dist/client; then
            echo "Generated Pages artifact still references the upstream repository path." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
