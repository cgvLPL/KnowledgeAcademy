name: Apply Knowledge Centre Apps Script sync

on:
  push:
    branches:
      - agent/sync-knowledge-centre-gas

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[knowledge-gas-sync-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/sync-knowledge-centre-gas
          fetch-depth: 0

      - name: Apply backend patch
        run: node scripts/apply-knowledge-centre-gas-sync.mjs

      - name: Remove one-time patch machinery
        run: |
          rm scripts/apply-knowledge-centre-gas-sync.mjs
          rm .github/workflows/apply-knowledge-centre-gas-sync.yml

      - name: Commit patched Apps Script source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-apps-script/Code.gs scripts/apply-knowledge-centre-gas-sync.mjs .github/workflows/apply-knowledge-centre-gas-sync.yml
          git commit -m "Sync Knowledge Centre with Apps Script [knowledge-gas-sync-applied]"
          git push origin HEAD:agent/sync-knowledge-centre-gas
