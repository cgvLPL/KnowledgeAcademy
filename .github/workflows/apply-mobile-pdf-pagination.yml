          desktop_replacement = '  await openPdfFromKnowledgeCentre(page);\n  const frame = page.locator(".knowledge-pdf-frame");\n  await expect(frame).toBeVisible();\n  await expect(frame).toHaveAttribute("src", /https:\\\/\\\\/file\\.garden\\/qa-cgv-academy\\/Cinema%20Operations%20Handbook\\.pdf#toolbar=1&navpanes=0&view=FitH/);\n  await expect(page.getByText("The document stays inside CGV Knowledge Academy.", { exact: false })).toBeVisible();'
          interaction = interaction.replace(desktop_anchor, desktop_replacement, 1)
          interaction_path.write_text(interaction)

          changelog_path.write_text('''# Mobile PDF pagination fix\n\nDate: 2026-08-19\n\n## Fixed\n\n- Replaced the phone iframe PDF experience with an app-controlled PDF.js canvas reader so iPhone/Safari users can move between every document page reliably.\n- Added explicit Previous/Next page controls with a live page count.\n- Added 75%–200% zoom controls for small-screen reading.\n- Hide the app topbar and bottom navigation while the immersive mobile reader is open so they can no longer cover PDF controls.\n- Kept the existing browser-native embedded PDF viewer on desktop.\n- Added a retry/error state with an emergency browser-open fallback if a host blocks PDF.js loading.\n\n## Verification\n\n- Added regression assertions for PDF.js page rendering, page navigation, zoom, body-level reader ownership, and mobile chrome suppression.\n- Extended Playwright coverage to navigate a three-page PDF from page 1 to page 3 and back on a 390×844 viewport.\n- Run the complete Verify application GitHub Actions workflow before merge.\n\n## Backend\n\nNo Google Apps Script schema or API changes are required for this fix. Existing direct File Garden PDF URLs continue to be used.\n''')
          PY

          rm -f .github/workflows/apply-mobile-pdf-pagination.yml

