name: Apply mobile PDF pagination fix

on:
  push:
    branches:
      - agent/fix-mobile-pdf-pagination

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-mobile-pdf-pagination
          fetch-depth: 0

      - name: Patch mobile PDF reader
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          knowledge_path = root / 'app/knowledge-centre.tsx'
          css_path = root / 'app/knowledge-pdf-reader.css'
          test_path = root / 'tests/knowledge-centre.test.mjs'
          interaction_path = root / 'tests/visual/ui.interaction.spec.mjs'
          changelog_path = root / 'updates/2026-08-19-mobile-pdf-pagination.md'

          knowledge = knowledge_path.read_text()
          knowledge = knowledge.replace(
              '  CheckCircle2,\n  Clock3,',
              '  CheckCircle2,\n  ChevronLeft,\n  ChevronRight,\n  Clock3,',
              1,
          )
          knowledge = knowledge.replace(
              '  Link2,\n  Pencil,\n  Plus,',
              '  Link2,\n  Minus,\n  Pencil,\n  Plus,',
              1,
          )
          knowledge = knowledge.replace(
              'import { useEffect, useMemo, useState, type ChangeEvent, type FormEvent } from "react";',
              'import { useEffect, useMemo, useRef, useState, type ChangeEvent, type FormEvent } from "react";',
              1,
          )

          marker = 'const MAX_IMPORT_BYTES = 256 * 1024;\n'
          additions = r'''
const PDFJS_VERSION = "5.4.296";
const PDFJS_MODULE_URL = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VERSION}/build/pdf.min.mjs`;
const PDFJS_WORKER_URL = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VERSION}/build/pdf.worker.min.mjs`;

type PdfViewportLike = { width: number; height: number };
type PdfRenderTaskLike = { promise: Promise<void>; cancel?: () => void };
type PdfPageLike = {
  getViewport: (options: { scale: number }) => PdfViewportLike;
  render: (options: {
    canvasContext: CanvasRenderingContext2D;
    viewport: PdfViewportLike;
    transform?: number[] | null;
  }) => PdfRenderTaskLike;
};
type PdfDocumentLike = {
  numPages: number;
  getPage: (pageNumber: number) => Promise<PdfPageLike>;
  destroy?: () => Promise<void> | void;
};
type PdfLoadingTaskLike = {
  promise: Promise<PdfDocumentLike>;
  destroy?: () => Promise<void> | void;
};
type PdfJsModuleLike = {
  GlobalWorkerOptions: { workerSrc: string };
  getDocument: (source: { url: string }) => PdfLoadingTaskLike;
};
'''
          if 'const PDFJS_VERSION' not in knowledge:
              knowledge = knowledge.replace(marker, marker + additions, 1)

          new_reader = r'''function useMobilePdfMode() {
  const [mobile, setMobile] = useState<boolean | null>(null);

  useEffect(() => {
    const query = window.matchMedia("(max-width: 760px)");
    const sync = () => setMobile(query.matches);
    sync();
    query.addEventListener("change", sync);
    return () => query.removeEventListener("change", sync);
  }, []);

  return mobile;
}

function MobilePdfDocument({ url }: { url: string }) {
  const stageRef = useRef<HTMLDivElement>(null);
  const canvasRef = useRef<HTMLCanvasElement>(null);
  const renderTaskRef = useRef<PdfRenderTaskLike | null>(null);
  const loadingTaskRef = useRef<PdfLoadingTaskLike | null>(null);
  const [documentProxy, setDocumentProxy] = useState<PdfDocumentLike | null>(null);
  const [pageNumber, setPageNumber] = useState(1);
  const [pageCount, setPageCount] = useState(0);
  const [zoom, setZoom] = useState(1);
  const [loading, setLoading] = useState(true);
  const [rendering, setRendering] = useState(false);
  const [error, setError] = useState("");
  const [retryKey, setRetryKey] = useState(0);
  const [renderRevision, setRenderRevision] = useState(0);

  useEffect(() => {
    let cancelled = false;
    let loadedDocument: PdfDocumentLike | null = null;

    setLoading(true);
    setError("");
    setPageNumber(1);
    setPageCount(0);
    setDocumentProxy(null);

    async function loadPdf() {
      try {
        const moduleUrl = PDFJS_MODULE_URL;
        const pdfjs = await import(/* @vite-ignore */ moduleUrl) as unknown as PdfJsModuleLike;
        pdfjs.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
        const loadingTask = pdfjs.getDocument({ url });
        loadingTaskRef.current = loadingTask;
        loadedDocument = await loadingTask.promise;
        if (cancelled) {
          await loadedDocument.destroy?.();
          return;
        }
        setDocumentProxy(loadedDocument);
        setPageCount(loadedDocument.numPages);
      } catch (reason) {
        if (!cancelled) {
          const detail = reason instanceof Error ? reason.message : "Unable to load this PDF.";
          setError(`The in-app PDF renderer could not load this document. ${detail}`);
        }
      } finally {
        if (!cancelled) setLoading(false);
      }
    }

    void loadPdf();
    return () => {
      cancelled = true;
      renderTaskRef.current?.cancel?.();
      void loadingTaskRef.current?.destroy?.();
      if (loadedDocument) void loadedDocument.destroy?.();
      loadingTaskRef.current = null;
    };
  }, [retryKey, url]);

  useEffect(() => {
    const stage = stageRef.current;
    if (!stage || typeof ResizeObserver === "undefined") return;
    let frame = 0;
    const observer = new ResizeObserver(() => {
      window.cancelAnimationFrame(frame);
      frame = window.requestAnimationFrame(() => setRenderRevision((value) => value + 1));
    });
    observer.observe(stage);
    return () => {
      window.cancelAnimationFrame(frame);
      observer.disconnect();
    };
  }, []);

  useEffect(() => {
    if (!documentProxy || !canvasRef.current || !stageRef.current) return;
    let cancelled = false;
    const canvas = canvasRef.current;
    const stage = stageRef.current;

    async function renderPage() {
      try {
        setRendering(true);
        renderTaskRef.current?.cancel?.();
        const page = await documentProxy.getPage(pageNumber);
        if (cancelled) return;
        const baseViewport = page.getViewport({ scale: 1 });
        const availableWidth = Math.max(260, stage.clientWidth - 20);
        const fitScale = availableWidth / Math.max(1, baseViewport.width);
        const viewport = page.getViewport({ scale: fitScale * zoom });
        const outputScale = Math.min(window.devicePixelRatio || 1, 2);
        const context = canvas.getContext("2d", { alpha: false });
        if (!context) throw new Error("Canvas rendering is unavailable on this device.");

        canvas.width = Math.max(1, Math.floor(viewport.width * outputScale));
        canvas.height = Math.max(1, Math.floor(viewport.height * outputScale));
        canvas.style.width = `${Math.floor(viewport.width)}px`;
        canvas.style.height = `${Math.floor(viewport.height)}px`;
        const transform = outputScale === 1 ? null : [outputScale, 0, 0, outputScale, 0, 0];
        const task = page.render({ canvasContext: context, viewport, transform });
        renderTaskRef.current = task;
        await task.promise;
        if (!cancelled) stage.scrollTo({ top: 0, left: 0, behavior: "auto" });
      } catch (reason) {
        if (!cancelled && !(reason instanceof Error && reason.name === "RenderingCancelledException")) {
          setError(reason instanceof Error ? reason.message : "Unable to render this PDF page.");
        }
      } finally {
        if (!cancelled) setRendering(false);
      }
    }

    void renderPage();
    return () => {
      cancelled = true;
      renderTaskRef.current?.cancel?.();
    };
  }, [documentProxy, pageNumber, renderRevision, zoom]);

  const previousPage = () => setPageNumber((page) => Math.max(1, page - 1));
  const nextPage = () => setPageNumber((page) => Math.min(pageCount || page, page + 1));
  const zoomOut = () => setZoom((value) => Math.max(0.75, Math.round((value - 0.25) * 100) / 100));
  const zoomIn = () => setZoom((value) => Math.min(2, Math.round((value + 0.25) * 100) / 100));

  return (
    <>
      <div
        ref={stageRef}
        className="knowledge-pdf-stage knowledge-pdf-mobile-stage"
        aria-busy={loading || rendering}
      >
        {error ? (
          <div className="knowledge-pdf-error" role="alert">
            <FileText size={30} />
            <strong>PDF preview unavailable</strong>
            <span>{error}</span>
            <div>
              <button type="button" className="secondary-button" onClick={() => setRetryKey((value) => value + 1)}>Retry</button>
              <a className="secondary-button" href={url} target="_blank" rel="noreferrer noopener">Open PDF</a>
            </div>
          </div>
        ) : (
          <>
            <canvas
              ref={canvasRef}
              className="knowledge-pdf-canvas"
              aria-label={pageCount ? `PDF page ${pageNumber} of ${pageCount}` : "PDF page"}
            />
            {(loading || rendering) && (
              <div className="knowledge-pdf-loading" role="status" aria-live="polite">
                {loading ? "Loading PDF…" : `Rendering page ${pageNumber}…`}
              </div>
            )}
          </>
        )}
      </div>

      <nav className="knowledge-pdf-mobile-controls" aria-label="PDF page controls">
        <button type="button" aria-label="Previous PDF page" onClick={previousPage} disabled={pageNumber <= 1 || !pageCount}>
          <ChevronLeft size={20} />
        </button>
        <span className="knowledge-pdf-page-indicator" aria-live="polite">
          <strong>{pageNumber}</strong><span aria-hidden="true"> / </span>{pageCount || "…"}
        </span>
        <button type="button" aria-label="Next PDF page" onClick={nextPage} disabled={!pageCount || pageNumber >= pageCount}>
          <ChevronRight size={20} />
        </button>
        <i aria-hidden="true" />
        <button type="button" aria-label="Zoom out PDF" onClick={zoomOut} disabled={zoom <= 0.75}>
          <Minus size={18} />
        </button>
        <span className="knowledge-pdf-zoom-value">{Math.round(zoom * 100)}%</span>
        <button type="button" aria-label="Zoom in PDF" onClick={zoomIn} disabled={zoom >= 2}>
          <Plus size={18} />
        </button>
      </nav>
    </>
  );
}

function PdfReader({
  title,
  url,
  onClose,
}: {
  title: string;
  url: string;
  onClose: () => void;
}) {
  const info = resourceInfo(url);
  const mobileMode = useMobilePdfMode();

  useEffect(() => {
    function keydown(event: KeyboardEvent) {
      if (event.key === "Escape") onClose();
    }
    const previousOverflow = document.body.style.overflow;
    document.body.classList.add("cgv-pdf-reader-open");
    document.body.style.overflow = "hidden";
    window.addEventListener("keydown", keydown);
    return () => {
      window.removeEventListener("keydown", keydown);
      document.body.classList.remove("cgv-pdf-reader-open");
      document.body.style.overflow = previousOverflow;
    };
  }, [onClose]);

  return (
    <div
      className="knowledge-pdf-backdrop"
      role="presentation"
      onMouseDown={(event) => {
        if (event.target === event.currentTarget) onClose();
      }}
    >
      <section
        className="knowledge-pdf-reader"
        data-pdf-renderer={mobileMode ? "pdfjs" : mobileMode === false ? "browser" : "preparing"}
        role="dialog"
        aria-modal="true"
        aria-labelledby="knowledge-pdf-title"
      >
        <header className="knowledge-pdf-toolbar">
          <div>
            <span className="knowledge-pdf-icon"><FileText size={18} /></span>
            <span>
              <small>{info.isFileGarden ? "FILE GARDEN PDF" : "PDF DOCUMENT"}</small>
              <strong id="knowledge-pdf-title">{title}</strong>
            </span>
          </div>
          <button type="button" onClick={onClose} aria-label="Close PDF reader">
            <X size={19} />
          </button>
        </header>

        {mobileMode === null ? (
          <div className="knowledge-pdf-stage knowledge-pdf-preparing" role="status">Preparing PDF reader…</div>
        ) : mobileMode ? (
          <MobilePdfDocument url={url} />
        ) : (
          <div className="knowledge-pdf-stage">
            <iframe
              className="knowledge-pdf-frame"
              src={info.viewerUrl}
              title={`${title} PDF`}
              referrerPolicy="no-referrer"
            />
          </div>
        )}

        {mobileMode === false && (
          <footer className="knowledge-pdf-footer">
            <span>PDF controls are provided inside the viewer. The document stays inside CGV Knowledge Academy.</span>
            <button className="secondary-button" type="button" onClick={onClose}>Close PDF</button>
          </footer>
        )}
      </section>
    </div>
  );
}'''

          pattern = r'function PdfReader\(\{[\s\S]*?\n\}\n\nfunction LessonReader'
