<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1450" height="320" viewBox="0 0 1450 320" role="img" aria-labelledby="title desc">
  <title id="title">CGV Knowledge Academy</title>
  <desc id="desc">Authentic red CGV mark, warm orange-to-red divider, and KnowledgeAcademy wordmark in light and bold white type, matching the ContactImporter identity.</desc>
  <defs>
    <clipPath id="cgvMarkCrop"><rect x="0" y="0" width="600" height="360"/></clipPath>
    <filter id="redTint" x="-10%" y="-10%" width="120%" height="120%">
      <feFlood flood-color="#ED3038" result="tint"/>
      <feComposite in="tint" in2="SourceAlpha" operator="in"/>
    </filter>
    <linearGradient id="divider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB11F"/>
      <stop offset="0.52" stop-color="#FF6A22"/>
      <stop offset="1" stop-color="#E6322F"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7D23"/>
      <stop offset="1" stop-color="#ED3038"/>
    </linearGradient>
  </defs>
  <!-- Preserve the CGV vector mark already included in this repository. -->
  <g transform="translate(35 35) scale(0.68)" clip-path="url(#cgvMarkCrop)" filter="url(#redTint)">
    <image x="0" y="0" width="1450" height="360" xlink:href="data:image/svg+xml;base64,"/>
  </g>
  <g transform="translate(445 65)" stroke="url(#spark)" stroke-width="8" stroke-linecap="round">
    <path d="M0 -25V-13M18 -18L10 -10M25 0H13M18 18L10 10M0 25V13M-18 18L-10 10M-25 0H-13M-18 -18L-10 -10"/>
  </g>
  <rect x="505" y="73" width="7" height="175" rx="3.5" fill="url(#divider)"/>
  <text x="551" y="195" fill="#F8F8F6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="79" letter-spacing="-2.7"><tspan font-weight="300">Knowledge</tspan><tspan font-weight="700">Academy</tspan></text>
</svg>
